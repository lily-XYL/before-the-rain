<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨停之前 · 人物立绘集</title>
<style>
:root{color-scheme:light;--ink:#244349;--muted:#7a8d85;--rose:#a57a76}*{box-sizing:border-box}body{margin:0;background:#eeeae1;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}header{max-width:1440px;margin:auto;padding:56px 50px 32px}header .en{font-size:10px;letter-spacing:5px;color:var(--rose)}h1{font-family:"SimSun",serif;font-size:40px;letter-spacing:7px;font-weight:400;margin:16px 0}header p{font-size:12px;color:var(--muted);line-height:2;letter-spacing:1px}.gallery{max-width:1440px;padding:0 40px 50px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.card{background:#faf8f2;border:1px solid #d9dacf;overflow:hidden;position:relative}.number{position:absolute;left:18px;top:18px;font-size:9px;letter-spacing:2px;color:#94a399;z-index:1}.art{width:100%;height:400px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 85%,#d4e0d44d,transparent 60%);border:0;padding:14px 12px;cursor:zoom-in}.art img{max-width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 7px #26433a0d)}.info{padding:20px 21px 24px;border-top:1px solid #e5e4d9}.meta{font-size:10px;letter-spacing:1px;color:var(--muted)}h2{font-family:"SimSun",serif;letter-spacing:4px;font-weight:400;font-size:25px;margin:12px 0}h2 span{font:10px "Microsoft YaHei",sans-serif;letter-spacing:0;color:#9b9f91;margin-left:6px}.theme{font-family:"SimSun",serif;font-size:12px;color:var(--rose);letter-spacing:1px}.desc{font-size:10px;line-height:1.9;color:var(--muted);min-height:38px}.download{display:inline-block;color:#4c7169;font-size:10px;text-decoration:none;letter-spacing:1px;border-bottom:1px solid #a4b5a5;padding-bottom:4px;margin-top:8px}.download:hover{color:#a57a76}footer{padding:0 45px 32px;text-align:center;font-size:10px;line-height:1.9;color:var(--muted);letter-spacing:1px}dialog{border:0;background:#e9ede5;max-width:94vw;max-height:94vh;padding:24px;box-shadow:0 20px 80px #12352e66}dialog::backdrop{background:#153a40c9;backdrop-filter:blur(5px)}dialog img{display:block;height:76vh;max-width:82vw;object-fit:contain;margin:auto}dialog h2{text-align:center;font-size:20px}dialog .close{position:absolute;right:10px;top:6px;border:0;background:none;color:#345349;font-size:27px;cursor:pointer}.status{font-size:11px;color:#a57a76;text-align:center;padding:20px}button:focus-visible,a:focus-visible{outline:2px solid #a57a76;outline-offset:4px}@media(max-width:1000px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 24px 40px}.art{height:440px}header{padding:40px 28px 24px}}@media(max-width:560px){.gallery{gap:12px;padding:0 14px 30px}.art{height:290px;padding:10px 5px}.info{padding:14px 12px}.meta{font-size:8px}h2{font-size:21px;letter-spacing:2px}.desc{font-size:9px;min-height:52px}.theme{font-size:11px}h1{font-size:30px}.number{left:10px;top:12px;font-size:8px}dialog{padding:20px 10px}dialog img{height:72vh}}@media print{header{padding-top:20px}.gallery{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.art{height:280px}.download{display:none}.desc{font-size:8px}.info{padding:10px}h2{font-size:20px}}
</style></head>
<body><header><div class="en">BEFORE THE RAIN STOPS / CHARACTER COLLECTION</div><h1>雨停之前 · 人物立绘</h1><p>一个雨季，八种不同的心事。<br>点击人物查看大图，下方链接可下载透明背景 PNG。</p></header><main id="gallery" class="gallery"></main><footer>初版常服立绘 · 全员成年 · 角色与故事设定见《故事大纲 v1》<br>使用内置 imagegen 生成，主角造型参考用户提供的手绘。</footer><dialog id="viewer"><button class="close" id="close" aria-label="关闭大图">×</button><img id="large" alt=""><h2 id="name"></h2></dialog>
<script src="assets/characters/v1/cast.js"></script>
<script>
const gallery=document.getElementById('gallery'),viewer=document.getElementById('viewer');
window.RainCast.forEach((c,i)=>{const card=document.createElement('article');card.className='card';const number=document.createElement('span');number.className='number';number.textContent='CHARACTER / '+String(i+1).padStart(2,'0');const art=document.createElement('button');art.className='art';art.setAttribute('aria-label','查看'+c.name+'的完整立绘');const img=document.createElement('img');img.src='assets/characters/v1/'+c.id+'.png';img.alt=c.name+'全身立绘';img.onerror=()=>{const note=document.createElement('p');note.className='status';note.textContent='立绘制作中';art.replaceChildren(note);art.disabled=true};art.append(img);art.onclick=()=>{document.getElementById('large').src=img.src;document.getElementById('large').alt=img.alt;document.getElementById('name').textContent=c.name;viewer.showModal()};const info=document.createElement('div');info.className='info';const meta=document.createElement('div');meta.className='meta';meta.textContent=c.role;const h=document.createElement('h2');h.textContent=c.name;const age=document.createElement('span');age.textContent=c.age+' 岁';h.append(age);const theme=document.createElement('p');theme.className='theme';theme.textContent=c.theme;const desc=document.createElement('p');desc.className='desc';desc.textContent=c.description;const link=document.createElement('a');link.className='download';link.href=img.src;link.download=c.id+'.png';link.textContent='透明 PNG ↗';info.append(meta,h,theme,desc,link);card.append(number,art,info);gallery.append(card)});document.getElementById('close').onclick=()=>viewer.close();viewer.onclick=e=>{if(e.target===viewer){const r=viewer.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)viewer.close()}};
</script></body></html>
